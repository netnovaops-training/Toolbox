# Whole-repo code health: on every push, every pull request and once a day.
# Thin caller; the checks live in shared-code-health.yml (this repo is the home of the shared version).
name: code-health

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    uses: ./.github/workflows/shared-code-health.yml
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload (public repo)
