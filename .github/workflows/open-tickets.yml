name: open-tickets

# Rebuilds OPEN.md on main: every unresolved ticket on any branch, with links to the
# entry and its pull request. Runs when a ticket branch is pushed and when a pull
# request is opened, closed, reopened, or switched between draft and ready.
# Its own commit can't re-trigger it: pushes made with GITHUB_TOKEN start no new runs.

on:
  push:
    paths:
      - 'knowledge/troubleshooting/**'
      - 'knowledge/installs/**'
      - 'knowledge/projects/**'
      - 'knowledge/learning/**'
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-tickets
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: List open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --limit 200 --json number,headRefName,url,isDraft > "$RUNNER_TEMP/prs.json"
      - name: Rebuild OPEN.md
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python3 -I code/local/build_open.py --prs "$RUNNER_TEMP/prs.json"
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain OPEN.md)" ]; then echo "No changes."; exit 0; fi
          git config user.name  "logbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPEN.md
          git commit -m "Rebuild open tickets [skip ci]"
          for _ in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
